# Compila il mondo WebGL e lo pubblica su GitHub Pages.
# In Settings → Pages scegli Source: "GitHub Actions" (non "Deploy from a branch":
# quella pubblica i sorgenti non compilati e il browser non trova /src/main.ts).
name: GitHub Pages

on:
  push:
    branches: [claude/relaxed-mendel-oc1px1, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/make-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
